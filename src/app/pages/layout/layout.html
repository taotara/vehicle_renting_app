<div class="app-shell">
  <header class="app-navbar">
    <a class="app-brand" href="/dashboard" aria-label="DriveFlow dashboard">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" role="img">
          <path
            d="M7.5 20.5 10.7 11h10.6l3.2 9.5M9.2 16h13.6M7.5 20.5h17v4h-17zM11 24.5v2M21 24.5v2M7.5 20.5 5.8 22M24.5 20.5l1.7 1.5"
          />
        </svg>
      </span>
      <span>DriveFlow</span>
    </a>

    <nav class="app-nav" aria-label="Main navigation">
      <a class="app-nav-link is-active" href="/dashboard">Dashboard</a>
      <a class="app-nav-link" href="/vehicles">Vehicles</a>
      <a class="app-nav-link" href="/booking">Bookings</a>
      <a class="app-nav-link" href="/customers">Customers</a>
    </nav>

    <div class="app-user-area">
      <div class="app-user-placeholder" aria-label="Logged in user">
        <span class="user-avatar" aria-hidden="true">{{loggedInUser.charAt(0) | uppercase}}</span>
        <span class="user-details">
          <strong>{{loggedInUser | uppercase}}</strong>
          <small>Administrator</small>
        </span>
      </div>
      <span class="navbar-divider" aria-hidden="true"></span>
      <button class="logout-button" type="button" (click)="logout()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 5h5v14h-5M10 12h9M14 8l-4 4 4 4M5 5h5M5 19h5" />
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </header>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
